services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    environment:
      PORT: 5050
      MONGODB_URI: mongodb://mongo:27017/ai_interview_prep
      JWT_SECRET: ${JWT_SECRET:-change-me}
      FRONTEND_URL: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      SEARCH_URL: https://www.google.com/search?q={query}
    ports:
      - "5050:5050"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5050/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data: